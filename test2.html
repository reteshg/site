<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fishnet Ad</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: transparent;
            font-family: Arial, sans-serif;
        }
        .padding-container {
            position: absolute;
            bottom: 100px;
            left: 100px;
            width: 250px;
            height: 200px;
        }
        .ad-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background-color: #ff3333;
            color: white;
            overflow: hidden;
            animation: pulse 2s infinite;
        }
        .logo {
            font-size: 48px;
            font-weight: bold;
            opacity: 0;
            transform: scale(0.5);
            transition: all 1s ease-in-out;
        }
        .animated {
            opacity: 1;
            transform: scale(1);
        }
        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(255, 51, 51, 0.7);
            }
            70% {
                box-shadow: 0 0 0 20px rgba(255, 51, 51, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(255, 51, 51, 0);
            }
        }
    </style>
</head>
<body>
    <div class="padding-container">
        <div class="ad-container">
            <div class="logo">Fishnet</div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const logo = document.querySelector('.logo');

            function animate() {
                logo.classList.remove('animated');

                setTimeout(() => {
                    logo.classList.add('animated');
                }, 500);
            }

            // Initial animation
            animate();

            // Loop the animation
            setInterval(animate, 5000);
        });
    </script>
</body>
</html>
